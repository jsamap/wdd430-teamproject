<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details | Handcrafted Haven</title>
  <link rel="stylesheet" href="styles/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather&family=Roboto&display=swap" rel="stylesheet" />
  <script src="scripts/script.js" defer></script>
</head>
<body>
  <header>
    <div class="logo">Handcrafted Haven</div>

    <button class="menu-toggle" id="menuToggle" aria-label="Open navigation menu">
      ☰
    </button>

    <nav id="mainNav">
      <a href="../index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="../cart.html">Cart</a>
      <a href="../contact.html">Contact</a>
    </nav>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      🌙
    </button>
  </header>

  <main>
    <section class="search-section fade-in">
      <input
        type="text"
        placeholder="Search products..."
        aria-label="Search products"
      />
    </section>

    <section class="details-page fade-in">
      <a href="products.html" class="button">← Back to Products</a>
      <h1 id="product-title">Product Title</h1>

      <div class="details-container">
        <div class="details-image">
          <img id="product-image" src="" alt="" />
        </div>

        <div class="details-info">
          <h2>Product Details</h2>

          <div class="rating" id="product-rating" aria-label="Product rating">
            ★★★★★ <span>4.8</span>
          </div>

          <p class="price" id="product-price">$0.00</p>
          <p id="product-description">Product description will appear here.</p>

          <label for="product-option" id="option-label">Option:</label>
          <select id="product-option"></select>

          <label for="quantity">Quantity:</label>
          <input type="number" id="quantity" value="1" min="1" />

          <button class="button" id="detailsAddToCartBtn">Add to Cart</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Handcrafted Haven | All Rights Reserved</p>
  </footer>
</body>
</html>
